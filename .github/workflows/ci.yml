name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Lune 0.10.5
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/lune.zip" \
            https://github.com/lune-org/lune/releases/download/v0.10.5/lune-0.10.5-linux-x86_64.zip
          echo "1fb5dee6a1afa1d300092805c6e660fe06144d29dd68c45cf6956f040667f791  $RUNNER_TEMP/lune.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/lune.zip" -d "$RUNNER_TEMP/lune"
          chmod +x "$RUNNER_TEMP/lune/lune"
          echo "$RUNNER_TEMP/lune" >> "$GITHUB_PATH"

      - name: Verify Lune version
        run: lune --version

      - name: Run deterministic regression suite
        run: lune run tests/run
